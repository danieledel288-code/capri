<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Capri settings</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --red: #ff2152; --red-dim: #6e1427; --cyan: #3ef2ff; --yellow: #f3e600; --text: #e6edf3; --muted: #6b7a88; --violet: #7b3dff; --glass: rgba(9, 10, 16, .96); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font-family: "Share Tech Mono", Consolas, monospace; color: var(--text); }
  .bevel { clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px)); }

  /* same HUD panel as the call chip */
  .shadow { position: absolute; left: 14px; top: 14px; width: 316px; height: 192px; background: var(--violet); opacity: .55; }
  .panel { position: absolute; left: 8px; top: 8px; width: 316px; height: 192px; padding: 10px 12px; }
  .panel::before, .panel::after { content: ""; position: absolute; inset: 0; clip-path: inherit; }
  .panel::before { background: linear-gradient(90deg, var(--red) 0 30%, var(--red-dim) 60%); }
  .panel::after { inset: 1px; background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px),
      linear-gradient(180deg, #11131c, var(--glass) 45%); }
  .panel > * { position: relative; z-index: 1; }
  .panel.in { animation: build .2s steps(5) both; }
  @keyframes build { 0% { transform: scaleY(.04); opacity: 0; } 40% { transform: scaleY(1.06); opacity: 1; } 100% { transform: none; } }

  .head { display: flex; align-items: center; gap: 8px; height: 18px; -webkit-app-region: drag; }
  .nm { background: var(--red); color: #0b0b10; font: 700 12px/18px Rajdhani, sans-serif; letter-spacing: .22em; padding: 0 10px 0 8px;
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); display: flex; align-items: center; gap: 5px; }
  .nm svg { width: 12px; height: 12px; }
  .status { font-size: 9px; letter-spacing: .14em; color: var(--muted); flex: 1; white-space: nowrap; }
  .status b { font-weight: normal; }
  .x { -webkit-app-region: no-drag; background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; padding: 0 2px; }
  .x:hover { color: var(--red); }

  .opts { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .opt { -webkit-app-region: no-drag; display: grid; grid-template-columns: 74px 1fr; align-items: center; height: 40px; padding: 0 10px;
    border: 1px solid #262a36; background: rgba(255,255,255,.02); cursor: pointer; text-align: left; color: var(--text); font: inherit;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px)); }
  .opt .t { font: 700 15px Rajdhani, sans-serif; letter-spacing: .2em; }
  .opt .d { font-size: 9.5px; line-height: 1.3; color: var(--muted); }
  .opt:hover { border-color: var(--c); background: rgba(255,255,255,.05); }
  .opt:hover .t, .opt.cur .t { color: var(--c); }
  .opt.cur { border-color: var(--c); background: linear-gradient(90deg, color-mix(in srgb, var(--c) 18%, transparent), transparent 70%); }
  .opt.cur .t::after { content: " ●"; font-size: 9px; vertical-align: 2px; }
  .opt.arm { border-color: var(--yellow); animation: arm .5s steps(2) infinite; }
  .opt.arm .d { color: var(--yellow); }
  @keyframes arm { 50% { background: rgba(243,230,0,.08); } }
  #on { --c: var(--cyan); } #off { --c: var(--text); } #school { --c: var(--red); }
</style>
</head>
<body>
<div class="shadow bevel"></div>
<div class="panel bevel in">
  <div class="head">
    <span class="nm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>CAPRI</span>
    <span class="status" id="status">LINK STATUS ...</span>
    <button class="x" id="x" title="Close (Esc)">✕</button>
  </div>
  <div class="opts">
    <button class="opt" id="on"><span class="t">ON</span><span class="d">Online. Call her with Ctrl+Alt+C.</span></button>
    <button class="opt" id="off"><span class="t">OFF</span><span class="d">Closed. Turn her back on from here.</span></button>
    <button class="opt" id="school"><span class="t">SCHOOL</span><span class="d">Closed + locked, and every Claude window closes too.</span></button>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const LABEL = { on: ['ONLINE', 'var(--cyan)'], off: ['OFFLINE', 'var(--text)'], school: ['SCHOOL MODE · LOCKED', 'var(--red)'] };
  const SCHOOL_DESC = $('school').querySelector('.d').textContent;
  let armTimer;

  function show(mode) {
    for (const id of ['on', 'off', 'school']) $(id).classList.toggle('cur', id === mode);
    const [txt, col] = LABEL[mode];
    $('status').innerHTML = `LINK STATUS · <b style="color:${col}">${txt}</b>`;
  }
  function disarm() { clearTimeout(armTimer); $('school').classList.remove('arm'); $('school').querySelector('.d').textContent = SCHOOL_DESC; }

  window.capri.mode().then(show);
  window.capri.on('mode', (m) => { show(m); if (m === 'on') setTimeout(() => window.capri.closePanel(), 700); });

  $('on').onclick = () => { disarm(); $('status').textContent = 'LINK STATUS · CONNECTING...'; window.capri.setMode('on'); };
  $('off').onclick = () => { disarm(); show('off'); setTimeout(() => window.capri.setMode('off'), 250); };
  // school mode closes every Claude window, so it takes a second click
  $('school').onclick = () => {
    const b = $('school');
    if (!b.classList.contains('arm')) {
      b.classList.add('arm');
      b.querySelector('.d').textContent = 'Click again to confirm. All Claude sessions close.';
      armTimer = setTimeout(disarm, 4000);
      return;
    }
    disarm(); show('school'); setTimeout(() => window.capri.setMode('school'), 250);
  };
  $('x').onclick = () => window.capri.closePanel();
  addEventListener('keydown', (e) => e.key === 'Escape' && window.capri.closePanel());
</script>
</body>
</html>
