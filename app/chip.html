<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CAPRI</title>
<link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --red: #ff2152; --red-dim: #6e1427; --cyan: #3ef2ff; --yellow: #f3e600; --text: #e6edf3; --muted: #6b7a88; --violet: #7b3dff; --glass: rgba(9, 10, 16, .94); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font-family: "Share Tech Mono", Consolas, monospace; color: var(--text); }

  /* the chip: 312 x 104, bevelled like the HUD panels */
  .panel { position: absolute; left: 14px; top: 22px; width: 326px; height: 100px; }
  .panel::before, .panel::after { content: ""; position: absolute; inset: 0;
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px)); }
  .panel::before { background: linear-gradient(90deg, var(--red) 0 30%, var(--red-dim) 60%); }
  .panel::after { inset: 1px; background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px),
      linear-gradient(180deg, #11131c, var(--glass) 45%); }
  .panel > * { position: relative; z-index: 1; }
  .shadow { position: absolute; left: 18px; top: 26px; width: 326px; height: 100px; background: var(--violet); opacity: .55;
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px)); }

  .col { position: absolute; left: 120px; right: 12px; top: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
  .row1 { display: flex; align-items: center; gap: 8px; height: 16px; }
  .nm { background: var(--red); color: #0b0b10; font: 700 12px/16px Rajdhani, sans-serif; letter-spacing: .22em; padding: 0 10px 0 8px;
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
  .status { font-size: 9px; letter-spacing: .14em; color: var(--yellow); white-space: nowrap; overflow: hidden; }
  .dot { margin-left: auto; width: 6px; height: 6px; background: var(--red); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0 } }

  .caption { flex: 1; font-size: 11.5px; line-height: 1.32; color: var(--text); overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; text-shadow: 0 0 6px rgba(62,242,255,.15); }
  .caption.sys { color: var(--muted); font-size: 10px; letter-spacing: .08em; }
  .caption .cur { display: inline-block; width: 6px; height: 11px; background: var(--red); vertical-align: -1px; margin-left: 1px; }
  #input { flex: 1; display: none; background: rgba(62,242,255,.06); border: 1px solid var(--cyan); color: var(--text);
    font: inherit; font-size: 12px; padding: 4px 6px; outline: none; }
  body.typing #input { display: block; } body.typing .caption { display: none; }

  .row3 { display: flex; align-items: flex-end; gap: 6px; height: 16px; }
  .bars { display: flex; gap: 2px; align-items: flex-end; height: 14px; margin-right: auto; }
  .bars i { width: 2px; height: 2px; background: var(--cyan); }
  button { background: none; border: 1px solid var(--red-dim); color: var(--red); font: inherit; font-size: 9px; letter-spacing: .1em;
    height: 16px; padding: 0 5px; cursor: pointer; }
  button:hover { background: var(--red); color: #0b0b10; }
  #eye.on { color: var(--cyan); border-color: rgba(62,242,255,.6); } #eye.on:hover { background: var(--cyan); color: #0b0b10; }
  #mic.live { background: var(--red); color: #0b0b10; box-shadow: 0 0 10px var(--red); }

  #fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

  /* build-in on ring, glitch-out on hang-up: stepped, like the feed */
  body.ringing .panel, body.ringing .shadow { animation: build .25s steps(5) both; }
  @keyframes build { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  body.ended .panel, body.ended .shadow { animation: tear .55s steps(6) .25s forwards; }
  @keyframes tear {
    30% { clip-path: inset(15% 0 40% 0); transform: translateX(-6px); }
    60% { clip-path: inset(55% 0 10% 0); transform: translateX(7px); filter: hue-rotate(90deg); }
    100% { clip-path: inset(50% 0 50% 0); opacity: 0; }
  }
</style>
</head>
<body>
<div class="shadow"></div>
<div class="panel" id="panel">
  <div class="col">
    <div class="row1"><span class="nm">CAPRI</span><span class="status" id="status">STANDBY</span><span class="dot"></span></div>
    <div class="caption sys" id="caption">// standby</div>
    <input id="input" autocomplete="off" spellcheck="false" placeholder="ask capri…">
    <div class="row3">
      <div class="bars" id="bars"></div>
      <button id="mic" title="Hold to talk (or hold Space)">TALK</button>
      <button id="eye" class="on" title="Screen vision">EYE</button>
      <button id="clr" title="Clear marks">CLR</button>
      <button id="end" title="Hang up">END</button>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>
<script src="feed.js"></script>
<script src="chip.js"></script>
</body>
</html>
